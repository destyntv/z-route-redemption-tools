name: Vercel build check

on:
  push:
    branches:
      - main
      - feature/vercel-modular-app
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check combined browser scripts
        run: cat public/js/*.js > /tmp/zroute-combined.js && node --check /tmp/zroute-combined.js
      - name: Build production site
        run: npm run build
